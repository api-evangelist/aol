name: AOL
description: >-
  AOL is a consumer internet media and communications brand — AOL.com news, AOL
  Mail, AOL Search and AOL Desktop — operated by AOL Media LLC. Founded as
  America Online, it was acquired by Verizon in 2015, folded into Oath and then
  Yahoo, and sold on to the Italian software company Bending Spoons in 2026; the
  security.txt AOL serves today points its PGP key at bendingspoons.com. AOL runs
  no developer program and publishes no product API. Its one publicly callable,
  machine-readable contract is the OpenID Connect provider at api.login.aol.com,
  which serves a full discovery document under its own issuer and lets a
  third-party application sign a user in with their AOL account. The legacy
  developer documentation for that identity stack is hosted by Yahoo Inc., which
  runs a sibling deployment of the same Oath-era OAuth 2.0 / OIDC platform.
