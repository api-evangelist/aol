description: >-
  AOL publishes no API plans or API pricing. This file replaces a 2026-05-04
  bulk-sweep scaffold that asserted Free / Professional / Enterprise tiers with
  request quotas and "TBD" prices for a provider that sells no API product. Those
  tiers did not exist. AOL's only API surface is its OpenID Connect provider,
  which is a sign-in integration offered at no charge alongside an app
  registration — there is nothing metered and nothing billed.
plan_count: 0
plans: []
note: >-
  AOL does sell CONSUMER subscriptions (the AOL Advantage plans — identity theft
  protection, tech support and premium mail bundles) but those are end-user
  products, not API plans, and they are not represented here. Their pricing pages
  could not be read as data either: https://www.aol.com/plans returns a Next.js
  404, and help.aol.com serves an 807-byte client-rendered shell for every path
  including /products/aol-advantage-plans, so no price, term or quota is present
  in any HTML AOL serves. No machine-readable pricing or catalog endpoint was
  found on any AOL host.
