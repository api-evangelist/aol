created: '2026-05-04'
modified: '2026-09-02'
description: >-
  AOL publishes no rate limits for its identity API. This file replaces a
  2026-05-04 bulk-sweep scaffold that asserted invented free/professional/
  enterprise tiers with invented per-minute and per-month numbers for a provider
  that has published none. Those numbers were never AOL's. An honest zero is the
  correct measurement here.
limit_count: 0
limits: []
headers: {}
headers_observed: []
responseCodes: {}
note: >-
  Searched AOL's OpenID Connect discovery document, its security.txt, its help
  centre and its status page for any published quota, throttle or fair-use
  statement covering api.login.aol.com — none exists. No RateLimit-*,
  X-RateLimit-* or Retry-After header was returned on any anonymous response
  observed from the identity host, including the 200 on /openid/v1/certs and the
  404 on /.well-known/api-catalog. AOL runs no developer portal where such a
  policy would normally live, so an integrator has no published runtime signal
  and no documented ceiling to design against.
